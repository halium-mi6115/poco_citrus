citrus:
  Vendor: Xiaomi
  PrettyName: POCO M3
  DeviceType: phone
  GridUnit: 22
  PrimaryOrientation: Portrait
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape
  FlashlightSysfsPath:
      - /sys/class/leds/flashlight/brightness
