citrus:
  Vendor: Xiaomi
  PrettyName: POCO M3
  DeviceType: phone
  GridUnit: 21
  PrimaryOrientation: Portrait
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape
  MirAndroidPlatformServerBackpressure:
    - false
  MirAndroidPlatformServerPartialUpdates:
    - true
  MirAndroidPlatformServerEglSync:
    - false
  MirAndroidPlatformClientEglFlush:
    - "!/usr/bin/unity8,!/usr/bin/lomiri,all"
  FlashlightSysfsPath:
      - /sys/class/leds/flashlight/brightness
  FlashlightSwitchPath:
      - /sys/class/leds/led:switch_0/brightness
  DoubleTapToWake:
      - /sys/touchpanel/double_tap|1|0
